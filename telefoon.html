@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  for(const dir of ['bake/','']){const r=await fetch(dir+'huis-bake.glb');if(r.ok)return {glb:await r.arrayBuffer(),lm:Object.fromEntries(BK_G.map(g=>[g,dir+'LM_'+g+'.jpg']))}}
  throw new Error('huis-bake.glb niet gevonden')}
async function bkLoad(){let dat;try{dat=await bkData()}catch(e){console.warn(e);return 0}
  const parts=bkParseGLB(dat.glb),tex={};
  await Promise.all(Object.entries(dat.lm).map(([g,src])=>new Promise(ok=>{const im=new Image();im.onload=()=>{const t=new T.Texture(im);t.flipY=false;t.needsUpdate=true;tex[g]=t;ok()};im.onerror=ok;im.src=src})));

  const KEY=(p,bb)=>[p.x,p.y,p.z,bb.max.x-bb.min.x,bb.max.y-bb.min.y,bb.max.z-bb.min.z].map(v=>Math.round(v*40)).join(',');
  const byKey=new Map(),used=new Set();parts.forEach((b,bid)=>{const k=KEY(b.t,b.g.boundingBox);if(!byKey.has(k))byKey.set(k,[]);byKey.get(k).push(b)});
  S.updateMatrixWorld(true);const wp=new T.Vector3();
  S.traverse(o=>{if(!o.isMesh||o.isInstancedMesh||Array.isArray(o.material))return;if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();
    o.getWorldPosition(wp);const c=(byKey.get(KEY(wp,o.geometry.boundingBox))||[]).filter(x=>!used.has(x));
    let b=c[0];if(!b){const x=parts.get(o.userData.bid);if(x&&!used.has(x))b=x}
    if(!b||!tex[b.lm])return;
    if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();if(!b.g.boundingBox)b.g.computeBoundingBox();
    {const A=o.geometry.boundingBox,B=b.g.boundingBox,tol=.01+.01*A.max.distanceTo(A.min);if(A.min.distanceTo(B.min)>tol||A.max.distanceTo(B.max)>tol){BKX.miss=(BKX.miss||0)+1;return}}
    const om=o.material,key=om.uuid+'|'+b.lm;let nm=cache.get(key);
    if(!nm){nm=new T.MeshBasicMaterial({color:om.color?om.color.clone():0xffffff,map:om.map||null,lightMap:tex[b.lm],lightMapIntensity:BKX.LMI,
        transparent:om.transparent,opacity:om.opacity,alphaTest:om.alphaTest,side:om.side,vertexColors:om.vertexColors,depthWrite:om.depthWrite});
      nm.onBeforeCompile=bkFloor;cache.set(key,nm);BKX.mats.push(nm);BKX.pairs.push([om,nm])}

// lampen verlichten het gebakken huis niet: daarom een warme gloed op de vloer onder elke lamp die aan staat
BKX.glow=[];
function bkGlows(){const cv=document.createElement('canvas');cv.width=cv.height=128;const x=cv.getContext('2d'),gr=x.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=gr;x.fillRect(0,0,128,128);
  const tx=new T.CanvasTexture(cv),rc=new T.Raycaster(),dn=new T.Vector3(0,-1,0),nn=new T.Vector3();
  const targets=[];S.traverse(o=>{if(o.isMesh&&!o.isInstancedMesh&&!(o.material&&o.material.transparent)&&!(typeof mk!=='undefined'&&o.parent===mk))targets.push(o)});
  D.forEach(d=>{if(d.t!=='light'||!d.p)return;const from=new T.Vector3(...d.p);rc.set(from,dn);rc.far=6;
    const hit=rc.intersectObjects(targets,false).find(h=>h.distance>.35&&h.face&&nn.copy(h.face.normal).transformDirection(h.object.matrixWorld).y>.7);
    const y=hit?hit.point.y:from.y-2.4,m=new T.Mesh(new T.CircleGeometry(2.5,40),new T.MeshBasicMaterial({map:tx,color:0xffbf73,transparent:true,blending:T.AdditiveBlending,depthWrite:false,opacity:0}));
    m.rotation.x=-Math.PI/2;m.position.set(from.x,y+.025,from.z);m.renderOrder=3;m.visible=false;S.add(m);BKX.glow.push([d,m])})}
function bkSync(){if(!BKX.on)return;
  BKX.glow.forEach(([d,m])=>{const lv=d.dim==null?1:d.dim,show=d.on&&(typeof lvl==='undefined'||lvl===3||d.f<=lvl);m.visible=!!show;m.material.opacity=(night?1:.5)*(.35+.65*lv)});const li=night?.58:BKX.LMI;BKX.FLOOR.value=night?.15:.34;

{const _ap=apply;apply=function(){_ap.apply(this,arguments);bkSync()}}
if(typeof xray!=='undefined'&&typeof view==='function'){const _vw=view;view=function(){_vw.apply(this,arguments);if(!(xray||lvl!==3||inside))D.forEach(d=>{if(d.m)d.m.visible=false});bkSync()};view()}
